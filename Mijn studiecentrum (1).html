<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mijn studiecentrum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0a0f26;--pn:#10173a;--pn2:#18204a;--bd:#29336a;--tx:#e6e9fa;--mu:#97a1d0;--ac:#8368f0;--ac2:#b9a9ff;--ok:#5fd3a0;--bad:#ff8fa0;--wn:#f4bd72;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--tx);font:16px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif}
nav{width:200px;flex:none;border-right:1px solid var(--bd);padding:20px 0;display:flex;flex-direction:column;overflow:auto}
nav h1{font-size:15px;font-weight:700;margin:0 20px 18px;color:var(--mu)}
nav button{all:unset;cursor:pointer;padding:10px 20px;color:var(--mu);display:flex;gap:12px;align-items:center;border-left:3px solid transparent}
nav button.on{color:var(--tx);border-left-color:var(--ac);background:var(--pn)}
nav button:hover{color:var(--tx)}
nav button:focus-visible{outline:2px solid var(--ac2);outline-offset:-2px}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:12px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--bd)}
.top input{flex:1;max-width:400px}
#st{margin-left:auto;color:var(--mu);font-size:14px}
main{flex:1;overflow:auto;padding:24px}
h2{margin:0 0 18px;font-size:24px;letter-spacing:-.01em}h3{margin:0 0 10px;font-size:16px;color:var(--ac2)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 32px}
.g>.c{background:none;border:0;border-top:1px solid var(--bd);border-radius:0;padding:12px 0 0}
.c{background:var(--pn);border:1px solid var(--bd);border-radius:4px;padding:16px}
.mu{color:var(--mu)}
input,select,textarea,.ed{background:var(--pn2);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:8px 10px;font:inherit;max-width:100%}
.b{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:8px 14px;font:inherit;cursor:pointer}
.b.s{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.b.d{background:#8a2c4c}
.okb{border-color:var(--ok)!important;background:#1b4a3c!important}
.badb{border-color:var(--bad)!important;background:#4d2236!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.ed:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bar{height:8px;border-radius:2px;background:var(--pn2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.t-studie{--bc:var(--ac)}.t-afspraak{--bc:#6fb4ff}.t-deadline{--bc:var(--bad)}.t-vakantie{--bc:var(--ok)}.t-herhaling{--bc:var(--wn)}
.ev{padding:5px 9px;border-radius:3px;margin:5px 0;border-left:4px solid var(--bc,var(--ac));background:var(--pn2);font-size:15px}
.zr{overflow-x:auto;border:1px solid var(--bd)}
.zh,.za,.zb{display:grid;grid-template-columns:48px repeat(var(--n),minmax(112px,1fr));min-width:calc(48px + var(--n)*112px)}
.zh>div{padding:8px 8px;border-left:1px solid var(--bd);font-weight:700}
.zh>div.now{color:var(--ac2)}
.za>div{border-left:1px solid var(--bd);padding:2px;min-height:4px}
.ad{display:block;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--tx);border:0;border-left:3px solid var(--bc);border-radius:3px;background:color-mix(in srgb,var(--bc) 26%,var(--bg));padding:2px 6px;margin:2px 0;cursor:pointer}
.zb{border-top:1px solid var(--bd)}
.tl{position:relative}.tl span{position:absolute;right:6px;margin-top:2px;font-size:12px;color:var(--mu)}
.col{position:relative;height:672px;border-left:1px solid var(--bd);background:linear-gradient(var(--bd) 1px,transparent 1px) 0 0/100% 48px}
.col.now{background-color:rgba(131,104,240,.07)}
.blk{position:absolute;left:2px;right:2px;overflow:hidden;text-align:left;font:inherit;font-size:13px;line-height:1.25;color:var(--tx);background:color-mix(in srgb,var(--bc,var(--ac)) 26%,var(--bg));border:0;border-left:3px solid var(--bc,var(--ac));border-radius:3px;padding:3px 6px;cursor:grab;touch-action:none}
.blk span{display:block;color:var(--mu)}
.nl{position:absolute;left:0;right:0;height:2px;background:var(--ac2);z-index:2;pointer-events:none}
.sp{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.fo button{all:unset;cursor:pointer;padding:5px 8px;border-radius:3px}
.fo.on button{background:var(--pn2);color:var(--ac2)}
.fo button:focus-visible{outline:2px solid var(--ac2)}
.ed{min-height:220px;line-height:1.6}.ed h3{color:var(--ac2)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--bd);background:transparent;margin:3px;padding:0}
button.dot{cursor:pointer}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.bad{background:var(--bad);border-color:var(--bad)}.dot.on{background:var(--ac);border-color:var(--ac2)}
.face{font-size:24px;text-align:center;padding:34px 16px;min-height:130px}
.chip{display:inline-block;margin:2px 8px 2px 0}
.h{display:none}
@media(max-width:760px){body{flex-direction:column}nav{order:2;width:auto;flex-direction:row;padding:0;border-right:0;border-top:1px solid var(--bd);justify-content:space-around}nav h1{display:none}nav button{flex-direction:column;gap:2px;font-size:12px;padding:8px 8px;border-left:0;border-top:3px solid transparent}nav button.on{border-top-color:var(--ac)}.sp{grid-template-columns:1fr}main{padding:14px}.top{padding:10px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Accounts en rollen */
#auth{position:fixed;inset:0;z-index:9999;background:rgba(5,9,25,.97);display:grid;place-items:center;padding:20px}
#auth .panel{width:min(430px,100%);background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:28px;box-shadow:0 24px 80px #0008}
#auth h2{margin-bottom:6px}#auth input{width:100%;margin:7px 0 12px}#auth .b{width:100%;margin-top:8px}
#auth .hint{font-size:13px;color:var(--mu);margin-top:14px}
#authmsg{min-height:22px;color:var(--wn);font-size:14px;margin-top:8px}
#account{margin-left:8px;font-size:13px;color:var(--mu)}
body.public nav,body.public .top #gq{display:none!important}
body.public .top{justify-content:flex-end}
body.public .planner-edit{display:none!important}
body.public .blk{pointer-events:none;cursor:default}
body.viewer .planner-edit{display:none!important}
body.viewer [contenteditable=true],body.viewer input,body.viewer textarea,body.viewer select{pointer-events:none;opacity:.75}
@media(max-width:760px){#auth .panel{padding:22px}}
</style></head>
<body>
<div id="auth"><div class="panel"><h2>Mijn studiecentrum</h2><p class="mu">Log in om je studieomgeving te openen.</p>
<label for="loginuser">Gebruikersnaam <span class="mu">(leeg laten voor vriend)</span></label><input id="loginuser" autocomplete="username" placeholder="Gebruikersnaam">
<label for="loginpass">Wachtwoord</label><input id="loginpass" type="password" autocomplete="current-password" placeholder="Wachtwoord">
<button class="b" id="loginbtn">Inloggen</button><button class="b s" id="publicbtn">Alleen rooster bekijken</button><div id="authmsg" role="status"></div>
<p class="hint">Eigenaar: gebruikersnaam kyra. Vriend: laat de gebruikersnaam leeg. Bezoekers kunnen alleen het rooster bekijken.</p></div></div>
<nav aria-label="Hoofdmenu"></nav>
<div class=wrap><div class=top><input id=gq type=search placeholder="Zoek in notities en begrippen" aria-label="Zoeken"><span id=st role=status></span><span id=account></span></div><main></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='VUL_HIER_JE_SUPABASE_PROJECT_URL_IN';
const SUPABASE_ANON_KEY='VUL_HIER_JE_SUPABASE_PUBLISHABLE_OF_ANON_KEY_IN';
let cloud=null,currentRole=null,cloudTimer=null;
const OWNER_EMAIL='kyra@studiecentrum.invalid',FRIEND_EMAIL='vriend@studiecentrum.invalid';
const K='studiecentrum-v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
p2=n=>String(n).padStart(2,'0'),iso=d=>{d=d||new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},
add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},wdOf=d=>(d.getDay()+6)%7,
fd=s=>new Date(s+'T12:00').toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'}),
nowT=()=>p2(new Date().getHours())+':'+p2(new Date().getMinutes()),shuf=a=>[...a].sort(()=>Math.random()-.5),
DAYS=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'],
TY={studie:'Studieblok',afspraak:'Afspraak',deadline:'Deadline',vakantie:'Vakantie of vrije dag',herhaling:'Doel of herhaalmoment'},
D=()=>({subjects:[],folders:[],notes:[],cards:[],events:[],tasks:[],goals:[],log:[],tests:[],qs:[],bk:null,dash:{order:['today','next','tasks','deadl','subj','chap','attn','tests','notes','due'],hidden:[]}});
let S;try{S=Object.assign(D(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=D()}
let ui={off:0,pv:innerWidth<760?'dag':'week',nw:null,sup:0,exOn:false,qe:null,v:'dash',sid:null,fid:null,nid:null,cd:null,ev:null,wk:0,conf:null,run:null,cust:false,q:'',msg:'',imp:'',ps:'all',pm:'k',pd:false},stT;
const setSt=t=>$('#st').textContent=t;
function save(){clearTimeout(stT);setSt('Opslaan…');stT=setTimeout(()=>{try{localStorage.setItem(K,JSON.stringify(S));setSt('Lokaal opgeslagen om '+nowT())}catch(e){setSt('Opslaan lukte niet: maak een back-up')}},300);if(currentRole==='owner'&&cloud){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,900)}}
async function cloudSave(){try{const payload={...S};const {error}=await cloud.from('study_data').upsert({id:1,payload,updated_at:new Date().toISOString()});if(error)throw error;const {error:delError}=await cloud.from('study_public_events').delete().neq('id','');if(delError)throw delError;if(S.events.length){const rows=S.events.map(e=>({id:String(e.id),title:e.title||'',type:e.type||'studie',rec:!!e.rec,wd:Number.isFinite(+e.wd)?+e.wd:0,date:e.date||null,end_date:e.end||null,s:e.s||null,e:e.e||null,sid:e.sid||null}));const {error:upError}=await cloud.from('study_public_events').upsert(rows);if(upError)throw upError}setSt('Online opgeslagen om '+nowT())}catch(e){console.error(e);setSt('Online opslaan mislukt — controleer Supabase-instellingen')}}
async function cloudLoad(role){if(role==='public'){const {data,error}=await cloud.from('study_public_events').select('*');if(error)throw error;S=D();S.events=(data||[]).map(e=>({id:e.id,title:e.title,type:e.type,rec:e.rec,wd:e.wd,date:e.date,end:e.end_date,s:e.s,e:e.e,sid:e.sid}));return}const {data,error}=await cloud.from('study_data').select('payload').eq('id',1).maybeSingle();if(error)throw error;if(data&&data.payload)S=Object.assign(D(),data.payload);else{try{S=Object.assign(D(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=D()}if(role==='owner')await cloudSave()}}
function roleBody(){document.body.classList.toggle('public',currentRole==='public');document.body.classList.toggle('viewer',currentRole==='friend');$('#account').textContent=currentRole==='owner'?'Eigenaar':currentRole==='friend'?'Alleen lezen':'Openbaar rooster';if(currentRole==='public'){ui.v='plan';$('#gq').style.display='none';$('nav').innerHTML='';}else{$('#gq').style.display='';$('nav').innerHTML='<h1>Mijn studiecentrum</h1>'+nv.map(n=>`<button data-a=go data-id=${n[0]}><svg viewBox="0 0 24 24" width=20 height=20 fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round>${n[1]}</svg>${n[2]}</button>`).join('')+'<button id="logoutbtn" style="margin-top:auto">Uitloggen</button>';$('#logoutbtn').onclick=logout;}}
async function enter(role){currentRole=role;await cloudLoad(role);$('#auth').style.display='none';roleBody();render();}
async function login(){const u=$('#loginuser').value.trim().toLowerCase(),pw=$('#loginpass').value;$('#authmsg').textContent='Bezig met inloggen…';if(!cloud){$('#authmsg').textContent='Vul eerst de Supabase URL en publishable/anon key in de HTML in.';return}if(!pw){$('#authmsg').textContent='Vul je wachtwoord in.';return}if(u&&u!=='kyra'){ $('#authmsg').textContent='Onbekende gebruikersnaam. Laat het veld leeg voor vriend.';return}const email=u==='kyra'?OWNER_EMAIL:FRIEND_EMAIL;const {data,error}=await cloud.auth.signInWithPassword({email,password:pw});if(error){$('#authmsg').textContent='Inloggen mislukt. Controleer gebruikersnaam en wachtwoord.';return}try{const {data:p,error:pe}=await cloud.from('study_users').select('role').eq('user_id',data.user.id).single();if(pe||!p||!['owner','friend'].includes(p.role))throw new Error('Geen geldige rol gekoppeld aan dit account.');await enter(p.role)}catch(e){await cloud.auth.signOut();$('#authmsg').textContent=e.message||'Account niet goed ingesteld.'}}
async function logout(){if(cloud)await cloud.auth.signOut();currentRole=null;$('#auth').style.display='grid';$('#loginpass').value='';$('#authmsg').textContent=''}
async function boot(){if(window.supabase&&SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('VUL_HIER'))cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);$('#loginbtn').onclick=login;$('#publicbtn').onclick=async()=>{if(!cloud){$('#authmsg').textContent='Vul eerst de Supabase URL en publishable/anon key in de HTML in.';return}try{await enter('public')}catch(e){$('#authmsg').textContent='Rooster laden mislukt. Controleer de Supabase-instellingen.'}};$('#loginpass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(cloud){const {data}=await cloud.auth.getSession();if(data.session){const {data:p}=await cloud.from('study_users').select('role').eq('user_id',data.session.user.id).single();if(p&&['owner','friend'].includes(p.role)){try{await enter(p.role);return}catch(e){}}}}} 

const sub=id=>S.subjects.find(s=>s.id===id),fol=id=>S.folders.find(f=>f.id===id),
pathOf=f=>f.pid&&fol(f.pid)?pathOf(fol(f.pid))+' › '+f.name:f.name,lab=f=>(sub(f.sid)?.name||'')+' › '+pathOf(f),
kids=(sid,pid)=>S.folders.filter(f=>f.sid===sid&&(f.pid||null)===pid),desc=id=>S.folders.filter(f=>f.pid===id).flatMap(f=>[f.id,...desc(f.id)]),
evOn=ds=>{const d=new Date(ds+'T12:00');return S.events.filter(e=>e.rec?e.wd===wdOf(d):(e.date<=ds&&ds<=(e.end||e.date))).sort((a,b)=>(a.s||'').localeCompare(b.s||''))},
mast=sid=>{const c=S.cards.filter(c=>!sid||c.sid===sid);return c.length?c.filter(c=>c.box>=4).length/c.length:0},
word=sid=>{if(!S.cards.some(c=>c.sid===sid))return'Nog geen kaarten';const m=mast(sid);return m>.66?'Sterk':m>.25?'Gaat goed':'Nog oefenen'},
bar=m=>`<div class=bar><i style="width:${Math.max(m*100,3)}%"></i></div>`,
cf=(a,id,l)=>ui.conf===a+id?`<button class="b d" data-a=${a} data-id=${id}>Zeker weten?</button>`:`<button class="b s" data-a=ask data-id=${a}${id}>${l}</button>`,
evRow=e=>`<div class="ev t-${e.type}"><b>${e.s?e.s+'–'+(e.e||''):'Hele dag'}</b> ${esc(e.title)}${e.rec?' ↻':''}</div>`,
tree=(sid,pid,d)=>kids(sid,pid).map(f=>`<div class="fo ${ui.fid===f.id?'on':''}" style="padding-left:${d*16}px"><button data-a=sf data-id=${f.id}>📁 ${esc(f.name)}</button> <span class=mu>${['','· bezig','· afgerond'][f.st||0]}</span></div>`+tree(sid,f.id,d+1)).join('');
const W={
today:['Vandaag gepland',()=>{const e=evOn(iso());return e.length?e.map(evRow).join(''):'<p class=mu>Niets gepland vandaag.</p>'}],
next:['Volgende studiesessie',()=>{for(let i=0;i<14;i++){const d=add(new Date(),i),e=evOn(iso(d)).find(e=>e.type==='studie'&&(i>0||(e.e||'23:59')>nowT()));if(e)return`<b>${esc(e.title)}</b><p class=mu>${i?DAYS[wdOf(d)]:'Vandaag'}, ${e.s||''}–${e.e||''}</p>`}return'<p class=mu>Nog geen studieblok gepland.</p>'}],
tasks:['Openstaande taken',()=>S.tasks.filter(t=>!t.done).map(t=>`<div class=r><label><input type=checkbox data-a=tk data-id=${t.id}> ${esc(t.text)}</label></div>`).join('')+`<div class=r><input id=nt placeholder="Nieuwe taak" data-enter=addtk><button class=b data-a=addtk>Toevoegen</button></div>`],
deadl:['Aankomende deadlines',()=>{const l=S.events.filter(e=>e.type==='deadline'&&e.date>=iso()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);return l.length?l.map(e=>`<div class="ev t-deadline"><b>${fd(e.date)}</b> ${esc(e.title)}</div>`).join(''):'<p class=mu>Geen deadlines in zicht.</p>'}],
subj:['Actieve vakken',()=>S.subjects.map(s=>`<div style="margin:8px 0"><div class=r><button class="b s" data-a=os data-id=${s.id}>${esc(s.name)}</button><span class=mu>${word(s.id)}</span></div>${bar(mast(s.id))}</div>`).join('')],
chap:['Hoofdstukken waar ik mee bezig ben',()=>S.folders.filter(f=>f.st===1).map(f=>`<div class=r><button class="b s" data-a=ofd data-id=${f.id}>${esc(lab(f))}</button></div>`).join('')||'<p class=mu>Zet een hoofdstuk op “bezig” bij Vakken.</p>'],
attn:['Extra aandacht',()=>{const m={};S.cards.filter(c=>c.n&&c.box<=1&&fol(c.fid)).forEach(c=>m[c.fid]=(m[c.fid]||0)+1);const l=Object.keys(m).sort((a,b)=>m[b]-m[a]).slice(0,4);return l.length?l.map(id=>`<div class=r><span>${esc(lab(fol(id)))}</span><button class="b s" data-a=pf data-id=${id}>Oefenen</button></div>`).join(''):'<p class=mu>Niets dat extra aandacht nodig heeft.</p>'}],
tests:['Recent gemaakte toetsen',()=>S.tests.slice(-3).reverse().map(t=>`<div style="margin:8px 0"><b>${esc(t.name)}</b> <span class=mu>${fd(t.date)}</span><div>${t.ok.map(()=>'<i class="dot ok"></i>').join('')}${t.bad.map(()=>'<i class="dot bad"></i>').join('')}</div></div>`).join('')||'<p class=mu>Nog geen toetsen gemaakt.</p>'],
notes:['Recente notities',()=>S.notes.slice().sort((a,b)=>b.t-a.t).slice(0,4).map(n=>`<div class=r><button class="b s" data-a=ofn data-id=${n.id}>${esc(n.title||'Naamloos')}</button></div>`).join('')||'<p class=mu>Nog geen notities.</p>'],
due:['Kaarten om te herhalen',()=>S.cards.some(c=>c.due<=iso())?'<p>Er staan kaarten voor je klaar.</p><button class=b data-a=pdue>Begin herhaling</button>':'<p class=mu>Alles is herhaald voor vandaag.</p>']};
const nv=[['dash','<rect x=3 y=3 width=7 height=8 rx=1 /><rect x=14 y=3 width=7 height=5 rx=1 /><rect x=14 y=12 width=7 height=9 rx=1 /><rect x=3 y=15 width=7 height=6 rx=1 />','Dashboard'],['plan','<rect x=3 y=5 width=18 height=16 rx=2 /><path d="M3 10h18M8 3v4M16 3v4M8 14h3"/>','Planner'],['subj','<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/>','Vakken'],['prac','<rect x=3 y=8 width=14 height=11 rx=2 /><path d="M7 8V5h14v11h-4"/>','Oefenen'],['prog','<path d="M4 20V11M10 20V4M16 20v-6M2 20h20"/>','Voortgang'],['back','<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>','Back-up']];
$('nav').innerHTML='<h1>Mijn studiecentrum</h1>'+nv.map(n=>`<button data-a=go data-id=${n[0]}><svg viewBox="0 0 24 24" width=20 height=20 fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round>${n[1]}</svg>${n[2]}</button>`).join('');
const go=(v,x)=>{if(currentRole==='public'&&v!=='plan')v='plan';Object.assign(ui,x||{},{v});render()};
function render(){if(currentRole==='public')ui.v='plan';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===ui.v));

function exStart(sc,mo,min,sh,ids){let q=S.qs.filter(x=>ids?ids.includes(x.id):sc==='all'||(sc[0]==='s'?x.sid===sc.slice(1):[sc.slice(1),...desc(sc.slice(1))].includes(x.fid)));ui.v='prac';if(!q.length){ui.msg='Geen vragen gevonden. Maak eerst vragen in de vragenbank bij een vak of map.';return render()}
if(sh)q=shuf(q);const o={};q.forEach(x=>{if(x.type==='mc')o[x.id]=shuf([x.a.split('|')[0],...x.o])});ui.msg='';ui.exOn=true;S.exrun={q:q.map(x=>x.id),a:{},o,i:0,mo,tot:min*60000,end:min?Date.now()+min*60000:0,left:0,sc,nm:scName(sc)};save();render()}
function exFinish(){const r=S.exrun;if(!r||r.done)return;r.done=true;r.end=0;r.res={};r.q.forEach(id=>{const q=S.qs.find(x=>x.id===id);if(q)r.res[id]=chk(q,r.a[id])});r.tid=uid();S.tests.push({id:r.tid,date:iso(),name:r.nm+' · toets',qs:r.q,sc:r.sc,ok:r.q.filter(i=>r.res[i]),bad:r.q.filter(i=>!r.res[i])});ui.exOn=true;save();render()}

function exRes(){const r=S.exrun,qs=r.q.map(id=>S.qs.find(x=>x.id===id)).filter(Boolean),bad=qs.filter(q=>!r.res[q.id]),tp=[...new Set(bad.map(q=>fol(q.fid)?lab(fol(q.fid)):null).filter(Boolean))];

async function act(t){const a=t.dataset.a,id=t.dataset.id,v=t.value;if(currentRole==='public'&&!['go','wk','pv'].includes(a))return;if(currentRole==='friend'&&!['go','pv','wk','os','ofd','sf','on','ofn','ofc'].includes(a))return;if(a!=='ask')ui.conf=null;const V=i=>$(i).value.trim();

case'tgo':return exStart($('#tsc').value,$('#tmo').value,+$('#ttm').value,$('#tsh').checked);

case'xfin':return exFinish();
case'xov':{const r=S.exrun;r.res[id]=!r.res[id];const tt=S.tests.find(x=>x.id===r.tid);tt.ok=r.q.filter(i=>r.res[i]);tt.bad=r.q.filter(i=>!r.res[i]);save();return render()}
case'xagain':{const r=S.exrun,ids=r.q.filter(i=>!r.res[i]),sc=r.sc,mo=r.mo,mn=r.tot/60000;S.exrun=null;return exStart(sc,mo,mn,true,ids)}
